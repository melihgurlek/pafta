# Pafta: shared (non-colour) kitty settings for the topographic-map rice.
# Kigae links kigae-current.conf here. Colours: pafta-night.conf (chart) and pafta-paper.conf
# (map sheet); kitty picks one from the system's light/dark preference via
# dark-theme.auto.conf / light-theme.auto.conf, so it follows the KDE scheme.

font_family           BlexMono Nerd Font
font_size             11.5
modify_font           cell_height 112%

window_padding_width  16
background_opacity    1
url_style             curly

# tab bar layout (its colours are the header colour in each theme file)
tab_bar_edge          top
tab_bar_style         separator
tab_separator         ""
tab_bar_min_tabs      2
tab_bar_margin_width  0
tab_bar_margin_height 0 0
tab_title_max_length  32
tab_title_template    "  {index} {title}  "
active_tab_title_template "  ● {title}  "
active_tab_font_style bold

# fallback when the system reports no light/dark preference
include pafta-night.conf
