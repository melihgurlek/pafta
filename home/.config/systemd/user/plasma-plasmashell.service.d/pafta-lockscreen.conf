# Pafta's lock screen is picked through plasmashellrc [Shell] ShellPackage, which plasmashell
# also reads as its own default. Name the desktop shell explicitly so plasmashell never starts
# as the lock screen package. With ShellPackage unset this is exactly the stock behaviour.
[Service]
ExecStart=
ExecStart=/usr/bin/plasmashell --no-respawn -p org.kde.plasma.desktop
